name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The plugin and the installer run the committed dist and skills, not
      # src: a change that was not rebuilt and committed would not ship.
      - run: git diff --exit-code -- plugins/severally
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
