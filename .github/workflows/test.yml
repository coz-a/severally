name: Test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every OS on the current LTS, and the oldest Node the package supports (engines) on one.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The plugin and the installer run the committed dist and skills, not
      # src: a change that was not rebuilt and committed would not ship.
      - run: git diff --exit-code -- plugins/severally
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
